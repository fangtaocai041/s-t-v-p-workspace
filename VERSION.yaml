# ═══════════════════════════════════════════════════════════════
# Runtime Invariants (verified at bootstrap + each cycle)
# ═══════════════════════════════════════════════════════════════
invariants:
  - id: "INV-001"
    name: "Topology DAG"
    check: "nx.is_directed_acyclic_graph(self.topology)"
    enforced_at: "bootstrap + reconfigure"
  - id: "INV-002"
    name: "Yang-verify isolation"
    check: "YangPole.verify() raises RuntimeError"
    enforced_at: "mypy strict + runtime"
  - id: "INV-003"
    name: "Yin-expand isolation"
    check: "YinPole.expand() raises RuntimeError"
    enforced_at: "mypy strict + runtime"
  - id: "INV-004"
    name: "EventBus isolation"
    check: "No direct vertex-to-vertex import"
    enforced_at: "import linter + code review"
  - id: "INV-005"
    name: "Spectral gap"
    check: "lambda2 >= 0.1 * baseline_lambda2"
    enforced_at: "reconfigure + health_pulse"
  - id: "INV-006"
    name: "DEVA fairness"
    check: "deva_count <= 0.25 * total_agents"
    enforced_at: "KarmaCourt.audit_fairness()"
  - id: "INV-007"
    name: "NARAKA self-healing"
    check: "NARAKA agents auto-reincarnate after cooldown"
    enforced_at: "SamsaraRing.run_karma_cycle()"
  - id: "INV-008"
    name: "Reincarnation atomicity"
    check: "7-step protocol with snapshot rollback"
    enforced_at: "ReincarnationProtocol.execute()"

# ═══════════════════════════════════════════════════════════════
# Runtime Cycle Schedule
# ═══════════════════════════════════════════════════════════════
runtime_cycles:
  health_pulse: { interval_s: 5,  component: "OriginKernel.health_pulse" }
  wuxing_flow:  { interval_s: 15, component: "WuXingFlowEngine.run_cycle" }
  karma_cycle:  { interval_s: 60, component: "SamsaraRing.run_karma_cycle" }
  tendril_health: { interval_s: 30, component: "TendrilManager.health_cycle" }
  chaos_disturb: { interval_queries: 100, component: "ChaosEngine.step" }
