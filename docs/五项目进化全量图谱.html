    --accent: #4da6e6;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

  }

  /* ============================================================

     ============================================================ */
  .container {

  /* ============================================================

  .hero h1 {
    font-size: 2.2em;

  .badge.porp  { color: var(--purple); border-color: var(--purple); }
  .badge.cog   { color: var(--accent); border-color: var(--accent); }

     Sections & Headings
     ============================================================ */

    font-size: 1.6em;

  }
  h4 {

    margin: 20px 0 8px;
    color: var(--text);

  p { margin-bottom: 12px; }

  /* ============================================================
     Blockquote
     ============================================================ */
  blockquote {
    border-left: 3px solid var(--purple);

    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--text2);
    font-style: italic;
  }
  blockquote strong { color: var(--text); }

  /* ============================================================
     Tables
     ============================================================ */
  .table-wrap {
    overflow-x: auto;
    margin: 16px 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .9em;
  }
  thead { background: var(--surface2); }
  th {
    padding: 10px 14px;
    text-align: left;
    font-weight: 700;
    color: var(--accent2);
    white-space: nowrap;
    border-bottom: 2px solid var(--border);
  }
  td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface); }
  td:first-child, th:first-child { text-align: center; }

  /* star marker */
  .star { color: var(--gold); font-weight: 800; }

  /* ============================================================
     Code / Pre
     ============================================================ */
  pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 14px 0;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: .82em;
    line-height: 1.55;
    color: var(--text);
  }
  code {
    font-family: var(--mono);
    font-size: .9em;
  }
  p code, li code, td code {
    background: var(--surface2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: .85em;
    color: var(--accent2);
  }
  pre code {
    background: none;
    padding: 0;
    color: inherit;
  }

  /* ============================================================
     Diagrams (ascii pre blocks)
     ============================================================ */
  pre.diagram {
    background: var(--diagram-bg);
    border-left: 3px solid var(--accent);
    color: var(--accent2);
    white-space: pre;
    line-height: 1.35;
    font-size: .78em;
  }
  pre.diagram-s {
    border-left-color: var(--cyan);
    color: var(--cyan);
  }
  pre.diagram-t {
    border-left-color: var(--purple);
    color: var(--purple);
  }
  pre.diagram-v {
    border-left-color: var(--accent);
    color: var(--accent2);
  }

  /* ============================================================
     Cards
     ============================================================ */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    margin: 16px 0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color .2s;
  }
  .card:hover { border-color: var(--accent); }
  .card h4 { margin-top: 0; }
  .card .icon { font-size: 1.6em; margin-bottom: 6px; }

  /* ============================================================
     Timeline
     ============================================================ */
  .timeline {
    position: relative;
    padding-left: 28px;
    margin: 20px 0;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: var(--border);
  }
  .tl-item {
    position: relative;
    margin-bottom: 18px;
  }
  .tl-item::before {
    content: '';
    position: absolute;
    left: -22px;
    top: 7px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }
  .tl-item.star::before {
    background: var(--gold);
    width: 14px; height: 14px;
    left: -24px; top: 5px;
  }
  .tl-item .tl-ver {
    font-weight: 700;
    color: var(--accent2);
    margin-right: 6px;
  }
  .tl-item.star .tl-ver { color: var(--gold); }
  .tl-item .tl-desc {
    color: var(--text2);
    font-size: .9em;
    margin-top: 2px;
  }

  /* ============================================================
     Stats / KPI row
     ============================================================ */
  .kpi-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0;
  }
  .kpi {
    flex: 1;
    min-width: 130px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;

  .kpi .val {
    font-size: 1.8em;
    font-weight: 800;
    color: var(--accent2);
  }
  .kpi .lbl {
    font-size: .78em;
    color: var(--text2);
    margin-top: 4px;
  }

  /* ============================================================
     Callout boxes
     ============================================================ */
  .callout {
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 16px 0;
    border-left: 4px solid;
    background: var(--surface);

  .callout.info  { border-color: var(--accent); }
  .callout.warn  { border-color: var(--gold); }
  .callout.good  { border-color: var(--green); }
  .callout.title { font-weight: 700; margin-bottom: 6px; }

  .flow {
    display: flex;
    align-items: center;

    flex-wrap: wrap;
    justify-content: center;
    margin: 20px 0;
    font-family: var(--mono);
    font-size: .82em;

  .flow .step {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    white-space: nowrap;
  }
  .flow .arrow {
    color: var(--text2);
    padding: 0 6px;
    font-size: 1.1em;
  }

  /* ============================================================
     Layer stack (5-layer viz)
     ============================================================ */
  .layer-stack {
    margin: 16px 0;
  }
  .layer {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-left: 4px solid;
    margin-bottom: 6px;
    background: var(--surface);
    border-radius: 0 var(--radius) var(--radius) 0;
    font-size: .9em;
  }
  .layer .l-num {
    font-weight: 800;
    font-size: 1.1em;
    min-width: 32px;
  }
  .layer .l-name { font-weight: 600; min-width: 80px; }
  .layer .l-file { color: var(--text2); font-family: var(--mono); font-size: .82em; }
  .layer.l1 { border-color: var(--teal);  }
  .layer.l2 { border-color: var(--accent); }
  .layer.l3 { border-color: var(--purple); }
  .layer.l4 { border-color: var(--gold);   }
  .layer.l5 { border-color: var(--pink);   }

  /* ============================================================
     Footer
     ============================================================ */
  footer {
    text-align: center;
    color: var(--text2);
    font-size: .82em;
    padding: 32px 0 0;
    border-top: 1px solid var(--border);
    margin-top: 48px;
  }

  /* ============================================================
     Theme Switcher
     ============================================================ */
  .theme-picker {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 999;
    display: flex;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 5px 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    backdrop-filter: blur(8px);
  }
  .theme-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    font-size: 1.1em;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    transition: all .2s;
    position: relative;
    color: var(--text2);
  }
  .theme-btn:hover {
    border-color: var(--accent);
    transform: scale(1.1);
    color: var(--text);
  }
  .theme-btn.active {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 10px var(--accent);
  }
  .theme-btn::after {
    content: attr(data-label);
    position: absolute;
    bottom: -22px;
    font-size: .6em;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .2s;
    color: var(--text2);
    pointer-events: none;
  }
  .theme-btn:hover::after {
    opacity: 1;
  }

  /* ============================================================
     Print
     ============================================================ */
  @media print {
    body { background: #fff; color: #000; font-size: 12px; }
    .container { max-width: 100%; padding: 20px; }
    pre, .card, .callout, .kpi, .layer { background: #f5f5f5; border-color: #ccc; }
    .hero h1 { -webkit-text-fill-color: #000; }
  }
</style>
</head>
