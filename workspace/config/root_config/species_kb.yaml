species:
- id: pseudaspius_hakonensis
  name: 珠星三块鱼
  scientific: Pseudaspius hakonensis
  authority: (Günther, 1877)
  aliases:
  - 日本三块鱼
  - 远东红鳍鱼
  - 大鳞红鳍鱼
  - 银滩头
