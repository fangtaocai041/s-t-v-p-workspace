  - 小鳞三块鱼
  - 珠星拟赤稍鱼
  synonyms:
  - name: Leuciscus hakonensis
    status: original_combination
    ref: Günther, 1877
  - name: Tribolodon hakonensis
    status: genus_reassigned
    ref: pre-2020 consensus
  - name: Tribolodon hakuensis
    status: spelling_variant
    ref: Günther 1880; corrected by Ishikawa 1895
  family: Leuciscidae (雅罗鱼科)
  subfamily: Pseudaspininae (拟赤稍鱼亚科)
  genus: Pseudaspius
  genus_cn: 拟赤稍鱼属
  genus_cn_note: 旧称三块鱼属 (Tribolodon); Sakai et al. 2020 将 Tribolodon 整体并入 Pseudaspius
  order: 鲤形目 (Cypriniformes)
  conservation: 无危 (IUCN 3.1)
  ecology: 溯河洄游鱼类
  max_length_cm: 50
  description: '珠星三块鱼属溯河洄游性鱼类，成鱼在海洋中生活，繁殖期溯河而上进入淡水河流产卵。 体型侧扁，体侧具不规则暗色斑块（"三块"之名源于体侧的斑块状花纹）。
    成熟个体体背侧布满白色粒状"珠星"，雄性珠星呈15-17纵行且密集，雌性约13-14纵行， 生殖期雌雄均呈现鲜艳婚姻色。是东北亚地区特有的经济鱼类和生态指示种。
    在日本被称作ウグイ (Ugui)。

    '
  economic_value: 东北亚重要经济鱼类
