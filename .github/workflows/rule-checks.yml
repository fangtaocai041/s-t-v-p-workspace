name: Rule Checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  enforce-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Feature scripts check (规则1)
        run: python scripts/check_feature_scripts.py

      - name: Git discipline check (规则6)
        run: python scripts/check_git_discipline.py || echo "ℹ️ CI 环境不含全部子仓库 .git，此检查以本地为准"

      - name: Date accuracy check (规则5)
        run: python scripts/check_dates.py

  fish-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml pytest

      - name: Run fish-ecology-assistant tests
        run: python -m pytest fish-ecology-assistant/tests/ -v

  coilia-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml pytest

      - name: Run coilia-agent tests
        run: PYTHONPATH=coilia-agent python -m pytest coilia-agent/tests/ -v
