name: Rule Checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  enforce-rules:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Feature scripts check (规则1)
        run: python scripts/check_feature_scripts.py || echo "⚠️ 规则1检查未通过（需本地确认）"

      - name: Git discipline check (规则6)
        run: python scripts/check_git_discipline.py || echo "⚠️ CI环境不含子仓库.git，以本地检查为准"

      - name: Date accuracy check (规则5)
        run: python scripts/check_dates.py || echo "⚠️ 日期检查未通过"

  fish-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml pytest

      - name: Run fish-ecology-assistant tests
        run: python -m pytest fish-ecology-assistant/tests/ -q --tb=short

  coilia-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml pytest

      - name: Run coilia-agent tests
        run: |
          cd coilia-agent
          python -m pytest tests/ -q --tb=short -k "not triangle_flow and not test_coilia"
