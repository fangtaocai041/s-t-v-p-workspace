# Anti-Hallucination CI
# 每次 push/PR 自动运行:
#   文献交叉验证 + 可信度评分 + 协调测试
name: Anti-Hallucination + Verification

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-references:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml

      - name: Credibility scorer
        run: |
          cd cognitive-search-engine 2>/dev/null || true
          python -c "
          import sys; sys.path.insert(0,'src')
          from credibility_scorer import score_paper, score_papers, detect_journal_tier
          r = score_paper(dict(source='PubMed',journal='Nature',citation_count=50))
          print('Scorer OK:', r)
          r2 = detect_journal_tier('Nature')
          print('Tier OK:', r2)
          "

      - name: Validator load check
        run: |
          python -c "
          import sys; sys.path.insert(0,'cognitive-search-engine')
          from src.validator import Validator
          v = Validator()
          print('Validator OK')
          "

      - name: Literature DB integrity
        run: |
          python -c "
          import os
          cn = '刘凯老师课题组/01_文献数据库/中文论文.md'
          if os.path.exists(cn):
            with open(cn, encoding='utf-8') as f:
                ai = f.read().count('[AI]')
            print('AI-tagged papers:', ai)
          else:
            print('Chinese DB not found')
          "

      - name: Coordination test
        run: python scripts/coordination_test.py --quick 2>&1 | tail -3
        continue-on-error: true

      - name: Summary
        run: |
          echo "Anti-hallucination checks complete."
          echo "See coordination_test.py output for cross-project verification."
